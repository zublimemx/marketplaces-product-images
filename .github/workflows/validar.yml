name: Validar
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validar.py
      - run: python -m py_compile scripts/*.py
      - run: python scripts/build_db.py --verificar
      - name: Revisar el visor
        run: |
          node --check visor/app.js
          node --check visor/xlsx.js
          node --check visor/precios.js
          node -e "global.window={};require('./visor/data/productos.js');const c=window.CATALOGO;if(!c||c.productos.length!==c.total){console.error('visor/data/productos.js inválido');process.exit(1)}console.log('visor:',c.total,'productos')"
