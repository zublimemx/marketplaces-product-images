# Integrar dentro del server {} del sitio. El navegador usa rutas relativas
# /api/meli/...; el backend Python permanece accesible solo en loopback.
location /api/meli/ {
    proxy_pass http://127.0.0.1:8765/api/meli/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 40m;
    proxy_read_timeout 120s;
}
